# Publish the download page in site/ to GitHub Pages.
#
# The page is static and reads the latest release from the GitHub API in the
# visitor's browser, so a release never needs a redeploy here. Only a change
# to the page itself does. See docs/release.md for the one-time Pages setup and
# for adding a custom domain.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy download page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The page's asset matching is the part that can break quietly.
      - run: node --test site/download.test.js
      - name: Stage
        run: |
          mkdir -p _site
          cp site/index.html site/download.js site/favicon.svg _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
