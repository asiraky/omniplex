# Build the landing page in site/ (an Astro site) and deploy it to Cloudflare
# as a Worker serving static assets, at https://omniplex.dev.
#
# The page is static and reads the latest release from the GitHub API in the
# visitor's browser, so a release never needs a redeploy here. Only a change
# to the page itself does. See docs/release.md for the one-time token setup.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy omniplex.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # site is an npm workspace, so this installs the whole tree. The page
      # needs none of Electron, so skip its binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The page's asset matching is the part that can break quietly.
      - run: npm run test:site
      - run: npm run build --workspace site
      - run: npx wrangler deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
